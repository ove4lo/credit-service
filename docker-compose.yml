services:
  app:
    build: . # Will build application from the Dockerfile in the current folder
    ports:
      - "4000:4000"
    environment:
      DATABASE_DSN: "postgres://postgres:secret@db:5432/credit?sslmode=disable"
    depends_on: 
      db: # Compose starts the database first, then the application
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: credit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: